<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cuarto de Pasos — Carta Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --burgundy: #7B1A2C;
      --burgundy-dark: #5A0F1E;
      --gold: #C9A84C;
      --gold-light: #E8D48B;
      --cream: #FFF8EE;
      --cream-dark: #F5ECD7;
      --text-dark: #2C1810;
      --text-medium: #5C4033;
      --text-light: #8B7355;
      --border: #E0D5C0;
      --shadow: rgba(44, 24, 16, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── HEADER ─── */
    .header {
      background: linear-gradient(135deg, var(--burgundy-dark) 0%, var(--burgundy) 50%, var(--burgundy-dark) 100%);
      color: white;
      text-align: center;
      padding: 28px 16px 18px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A84C' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.5;
    }

    .header-content { position: relative; z-index: 1; }

    .restaurant-name {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      letter-spacing: 1px;
    }

    .restaurant-subtitle {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
      opacity: 0.9;
    }

    /* ─── LANGUAGE SELECTOR ─── */
    .lang-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--cream-dark);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: white;
      font-family: 'Lato', sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-medium);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .lang-btn:hover {
      border-color: var(--gold);
      color: var(--burgundy);
    }

    .lang-btn.active {
      background: var(--burgundy);
      color: white;
      border-color: var(--burgundy);
      font-weight: 700;
    }

    .lang-btn .flag { font-size: 1.1rem; }

    /* ─── TAB NAVIGATION ─── */
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 0;
      background: white;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 44px;
      z-index: 99;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .tab-btn {
      flex: 1;
      max-width: 160px;
      padding: 12px 8px;
      border: none;
      background: transparent;
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      position: relative;
      transition: color 0.25s ease;
    }

    .tab-btn:hover { color: var(--burgundy); }

    .tab-btn.active {
      color: var(--burgundy);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 20%;
      width: 60%;
      height: 3px;
      background: var(--gold);
      border-radius: 2px 2px 0 0;
    }

    /* ─── CONTENT ─── */
    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 12px 40px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ─── SECTIONS ─── */
    .section {
      margin-top: 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--burgundy);
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--gold), transparent);
    }

    /* ─── DUAL PRICE HEADER ─── */
    .dual-header {
      display: flex;
      justify-content: flex-end;
      gap: 0;
      margin-bottom: 4px;
      padding-right: 4px;
    }

    .dual-header span {
      width: 52px;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
    }

    /* ─── MENU ITEMS ─── */
    .menu-item {
      display: flex;
      align-items: baseline;
      padding: 8px 4px;
      border-bottom: 1px dotted var(--border);
      transition: background 0.2s;
    }

    .menu-item:last-child { border-bottom: none; }

    .menu-item:hover {
      background: rgba(201, 168, 76, 0.06);
      border-radius: 6px;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .item-desc {
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--text-light);
      margin-top: 1px;
      line-height: 1.3;
    }

    .item-prices {
      display: flex;
      align-items: baseline;
      gap: 0;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .item-price {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--burgundy);
      white-space: nowrap;
    }

    .item-price.dual {
      width: 52px;
      text-align: center;
      font-size: 0.85rem;
    }

    .price-label {
      font-family: 'Lato', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      color: var(--text-light);
      text-transform: uppercase;
      margin-left: 3px;
    }

    .price-supplement::before {
      content: '+';
    }

    /* ─── TAPA / PLATO PRICING ─── */
    .item-price-multi {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .price-row .item-price {
      font-size: 0.85rem;
    }

    /* ─── SECTION NOTE ─── */
    .section-note {
      font-size: 0.75rem;
      font-style: italic;
      color: var(--text-light);
      text-align: center;
      margin-top: 8px;
      padding: 8px;
      background: rgba(201, 168, 76, 0.08);
      border-radius: 6px;
    }

    /* ─── SLOGAN ─── */
    .slogan {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 600;
      font-style: italic;
      color: var(--burgundy);
      text-align: center;
      padding: 20px 16px;
      margin-top: 24px;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
    }

    /* ─── FOOTER ─── */
    .footer {
      text-align: center;
      padding: 20px 16px;
      font-size: 0.7rem;
      color: var(--text-light);
      line-height: 1.5;
    }

    .footer .gluten-free {
      display: inline-block;
      background: var(--cream-dark);
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 700;
      color: var(--burgundy);
      margin-bottom: 10px;
      border: 1px solid var(--gold);
    }

    /* ─── ORNAMENT ─── */
    .ornament {
      text-align: center;
      margin: 16px 0;
      color: var(--gold);
      font-size: 1.2rem;
      letter-spacing: 8px;
      opacity: 0.6;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 380px) {
      .restaurant-name { font-size: 1.6rem; }
      .tab-btn { font-size: 0.8rem; padding: 10px 4px; }
      .lang-btn { padding: 5px 8px; font-size: 0.72rem; }
      .section-title { font-size: 1.15rem; }
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section {
      animation: fadeIn 0.4s ease both;
    }

    .section:nth-child(2) { animation-delay: 0.05s; }
    .section:nth-child(3) { animation-delay: 0.10s; }
    .section:nth-child(4) { animation-delay: 0.15s; }
    .section:nth-child(5) { animation-delay: 0.20s; }
    .section:nth-child(6) { animation-delay: 0.25s; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-content">
      <h1 class="restaurant-name">Cuarto de Pasos</h1>
      <p class="restaurant-subtitle" id="subtitle"></p>
    </div>
  </header>

  <!-- LANGUAGE SELECTOR -->
  <nav class="lang-bar" id="langBar"></nav>

  <!-- TAB NAVIGATION -->
  <nav class="tab-bar" id="tabBar"></nav>

  <!-- CONTENT -->
  <main class="content">
    <div class="tab-content active" id="tab-menu"></div>
    <div class="tab-content" id="tab-breakfast"></div>
    <div class="tab-content" id="tab-drinks"></div>

    <!-- SLOGAN -->
    <div class="slogan" id="slogan"></div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="gluten-free" id="glutenFree"></div>
      <p id="allergenNote"></p>
    </footer>
  </main>

  <!-- LOAD MENU DATA -->
  <script src="menu-data.js"></script>

  <script>
    // ─── ESTADO ───
    let currentLang = localStorage.getItem('cdp-lang') || navigator.language.slice(0, 2);
    if (!MENU_DATA.languages[currentLang]) currentLang = 'es';
    let currentTab = 'menu';

    // ─── UTILIDADES ───
    function t(obj) {
      if (!obj) return '';
      return obj[currentLang] || obj['es'] || '';
    }

    function formatPrice(price) {
      return price.toFixed(2).replace('.', ',') + '€';
    }

    // ─── CONSTRUIR SELECTOR DE IDIOMA ───
    function buildLangBar() {
      const bar = document.getElementById('langBar');
      bar.innerHTML = '';
      Object.entries(MENU_DATA.languages).forEach(([code, lang]) => {
        const btn = document.createElement('button');
        btn.className = 'lang-btn' + (code === currentLang ? ' active' : '');
        btn.innerHTML = `<span class="flag">${lang.flag}</span> ${lang.label}`;
        btn.onclick = () => {
          currentLang = code;
          localStorage.setItem('cdp-lang', code);
          document.documentElement.lang = code;
          render();
        };
        bar.appendChild(btn);
      });
    }

    // ─── CONSTRUIR TABS ───
    function buildTabBar() {
      const bar = document.getElementById('tabBar');
      bar.innerHTML = '';
      const tabs = [
        { id: 'menu', label: MENU_DATA.ui.menuTitle },
        { id: 'breakfast', label: MENU_DATA.ui.breakfastTitle },
        { id: 'drinks', label: MENU_DATA.ui.drinksTitle }
      ];
      tabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (tab.id === currentTab ? ' active' : '');
        btn.textContent = t(tab.label);
        btn.onclick = () => {
          currentTab = tab.id;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        bar.appendChild(btn);
      });
    }

    // ─── RENDERIZAR UN ITEM ───
    function renderItem(item, section) {
      const div = document.createElement('div');
      div.className = 'menu-item';

      const info = document.createElement('div');
      info.className = 'item-info';
      info.innerHTML = `
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${t(item.desc)}</div>
      `;
      div.appendChild(info);

      // Determinar tipo de precio
      if (section.dualPrice && (item.priceHalf !== undefined || item.priceFull !== undefined)) {
        // Precio doble (medias / entera)
        const prices = document.createElement('div');
        prices.className = 'item-prices';
        if (item.priceHalf !== undefined) {
          prices.innerHTML += `<span class="item-price dual">${formatPrice(item.priceHalf)}</span>`;
        } else {
          prices.innerHTML += `<span class="item-price dual" style="visibility:hidden">—</span>`;
        }
        prices.innerHTML += `<span class="item-price dual">${formatPrice(item.priceFull)}</span>`;
        div.appendChild(prices);
      } else if (item.priceTapa !== undefined && item.pricePlato !== undefined) {
        // Precio tapa / plato
        const mp = document.createElement('div');
        mp.className = 'item-price-multi';
        mp.innerHTML = `
          <div class="price-row">
            <span class="item-price">${formatPrice(item.priceTapa)}</span>
            <span class="price-label">${t(MENU_DATA.ui.tapa)}</span>
          </div>
          <div class="price-row">
            <span class="item-price">${formatPrice(item.pricePlato)}</span>
            <span class="price-label">${t(MENU_DATA.ui.plate)}</span>
          </div>
        `;
        div.appendChild(mp);
      } else if (item.priceSupplement !== undefined) {
        // Suplemento
        const prices = document.createElement('div');
        prices.className = 'item-prices';
        prices.innerHTML = `<span class="item-price price-supplement">${formatPrice(item.priceSupplement)}</span>`;
        div.appendChild(prices);
      } else if (item.price !== undefined) {
        // Precio simple
        const prices = document.createElement('div');
        prices.className = 'item-prices';
        let label = '';
        if (item.priceLabel === 'tapa') label = `<span class="price-label">${t(MENU_DATA.ui.tapa)}</span>`;
        else if (item.priceLabel === 'plato') label = `<span class="price-label">${t(MENU_DATA.ui.plate)}</span>`;
        prices.innerHTML = `<span class="item-price">${formatPrice(item.price)}</span>${label}`;
        div.appendChild(prices);
      }

      return div;
    }

    // ─── RENDERIZAR UNA SECCIÓN ───
    function renderSection(section) {
      const div = document.createElement('div');
      div.className = 'section';
      div.id = section.id;

      // Header de sección
      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <h2 class="section-title">${t(section.name)}</h2>
        <div class="section-line"></div>
      `;
      div.appendChild(header);

      // Header de precio doble
      if (section.dualPrice) {
        const dh = document.createElement('div');
        dh.className = 'dual-header';
        dh.innerHTML = `
          <span>${t(MENU_DATA.ui.halfSize)}</span>
          <span>${t(MENU_DATA.ui.fullSize)}</span>
        `;
        div.appendChild(dh);
      }

      // Items
      section.items.forEach(item => {
        div.appendChild(renderItem(item, section));
      });

      // Nota de sección
      if (section.note) {
        const note = document.createElement('div');
        note.className = 'section-note';
        note.textContent = t(MENU_DATA.ui[section.note]) || section.note;
        div.appendChild(note);
      }

      return div;
    }

    // ─── RENDERIZAR TODO ───
    function render() {
      // Actualizar idioma
      buildLangBar();
      buildTabBar();

      // Actualizar header
      document.getElementById('subtitle').textContent = t(MENU_DATA.restaurant.subtitle);
      document.getElementById('slogan').textContent = t(MENU_DATA.restaurant.slogan);
      document.getElementById('glutenFree').textContent = t(MENU_DATA.restaurant.glutenFreeNote);
      document.getElementById('allergenNote').textContent = t(MENU_DATA.restaurant.allergenNote);

      // Renderizar contenido de cada tab
      const tabMap = { menu: 'tab-menu', breakfast: 'tab-breakfast', drinks: 'tab-drinks' };
      Object.entries(tabMap).forEach(([tabId, containerId]) => {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        container.className = 'tab-content' + (tabId === currentTab ? ' active' : '');

        const sections = MENU_DATA.sections.filter(s => s.tab === tabId);
        sections.forEach((section, i) => {
          container.appendChild(renderSection(section));
          // Ornamento entre secciones
          if (i < sections.length - 1) {
            const orn = document.createElement('div');
            orn.className = 'ornament';
            orn.textContent = '⸻ ✦ ⸻';
            container.appendChild(orn);
          }
        });
      });
    }

    // ─── INICIALIZAR ───
    document.documentElement.lang = currentLang;
    render();
  </script>
</body>
</html>
